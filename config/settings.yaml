blender:
  path: "${BLENDER_PATH:/usr/bin/blender}"
  version_min: "3.6"

output:
  base_dir: "outputs"
  renders_dir: "outputs/renders"
  uploads_dir: "outputs/uploads"

video:
  format: "mp4"
  resolution: [1080, 1920]   # 9:16 vertical
  fps: 60
  max_duration_sec: 59       # YouTube Shorts limit

render:
  default_preset: "high"
  engine: "CYCLES"
  device: "${RENDER_DEVICE:CPU}"

youtube:
  category_id: "28"           # Science & Technology
  privacy: "private"          # Start private, review then publish
  tags:
    - chaos
    - simulation
    - physics
    - satisfying
    - shorts

templates:
  default_video_template: "default_shorts"

hyperframes:
  enabled: true
  fps: 60
  transparent_overlays: true

voicevox:
  url: "${VOICEVOX_URL:http://localhost:50021}"
  default_speaker: 3          # ずんだもん(ノーマル)
  default_speed: 1.0
  default_pitch: 0.0

narration:
  estimate_sec_per_char: 0.18  # used to size the silent stub when VOICEVOX is down

comfyui:
  # Cost guards for `source: comfyui`. Video generation is an order of magnitude
  # more expensive than image generation, so the defaults sit at the bottom of
  # every axis and a concept has to ask to go higher.
  resolution: "480P"        # 480P / 720P / 1080P — roughly $0.05/$0.10/$0.15 per second
  shot_duration_sec: 5      # the model accepts 5, 10 or 15 only
  max_shots: 6              # ceiling per concept, so one YAML cannot run away
  keyframe_size: "768x1344" # closest Recraft V4 size to 9:16

compositing:
  bgm_volume: 0.18
  narration_volume: 1.0
  sfx_volume: 0.55
  system_sounds_dir: /System/Library/Sounds

thumbnail:
  size: [1280, 720]
  default_style: "bold_headline"
