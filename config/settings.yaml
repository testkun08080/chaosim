blender:
  path: "${BLENDER_PATH:/usr/bin/blender}"
  version_min: "3.6"

output:
  base_dir: "outputs"
  renders_dir: "outputs/renders"
  uploads_dir: "outputs/uploads"

video:
  format: "mp4"
  resolution: [1080, 1920]   # 9:16 vertical
  fps: 60
  max_duration_sec: 59       # YouTube Shorts limit

render:
  default_preset: "high"
  engine: "CYCLES"
  device: "${RENDER_DEVICE:CPU}"

youtube:
  category_id: "28"           # Science & Technology
  privacy: "private"          # Start private, review then publish
  tags:
    - chaos
    - simulation
    - physics
    - satisfying
    - shorts

templates:
  default_video_template: "default_shorts"

hyperframes:
  enabled: true
  fps: 60
  transparent_overlays: true

voicevox:
  url: "${VOICEVOX_URL:http://localhost:50021}"
  default_speaker: 3          # ずんだもん(ノーマル)
  default_speed: 1.0
  default_pitch: 0.0

narration:
  estimate_sec_per_char: 0.18  # used to size the silent stub when VOICEVOX is down

compositing:
  bgm_volume: 0.18
  narration_volume: 1.0

thumbnail:
  size: [1280, 720]
  default_style: "bold_headline"
