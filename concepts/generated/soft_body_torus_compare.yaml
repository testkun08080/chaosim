title: "0% vs 100% Soft Body — Torus Edition"
slug: soft_body_torus_compare
simulator: blender
scene_script: soft_body_torus_compare
duration_sec: 12
description: >
  Two identical tori sit side by side. A metal cylinder drops into each one on
  the same frame. The left torus is fully rigid and gives a hard clack; the
  right one is fully soft and swallows the cylinder like jelly. Same drop, same
  instant, opposite result.
hook: "落下は1フレーム目から。着地の瞬間に左右で結果が割れる"
viral_angle: >
  Kintsugi_3DCG の最再生フォーマット「0% vs 100% Torus Soft Body」と、同型の
  TikTok トレンド（@factsforyou831 のガラス管ソフトボディ、いいね32.7万）の直系。
  比較フォーマットは冒頭1秒で「何を見ればいいか」が伝わるため完走率が高い。
  同時再生にしたのは、段階再生だと後半が答え合わせだけになって離脱するため。
references:
  - "Kintsugi_3DCG — 0% vs 100% Torus 3D Soft Body Simulation (youtube.com/shorts/JdTzHc_mwlw)"
  - "Kintsugi_3DCG — Cylinder Sliding Into the Torus Soft Body Simulation (youtube.com/shorts/75dWX87ECAM)"
  - "@factsforyou831 (TikTok) — 3D Satisfying Simulation, ガラス管ソフトボディ"
  - "Kawaken_3DCG — Cloth Simulation by different Faces（同リポジトリ cloth_by_faces の参照元。比較フォーマットの先例）"
params:
  softness_values: [0.0, 1.0]       # 0 = 完全剛体 / 1 = 完全ソフト
  torus_major_radius: 0.8
  torus_minor_radius: 0.3
  torus_segments: 32
  torus_rings: 14
  column_spacing: 2.2
  dropped_object: cylinder
  drop_radius: 0.34
  drop_height: 1.9
  drop_frames: 26
  soft_body_mass: 0.4
  soft_body_friction: 0.5
  soft_body_bend: 0.3
  material_style: glass
  camera_distance: 7.3
  camera_height: 0.0
  camera_pitch_deg: 66
  camera_lens: 40
render_preset: preview   # Phase 1 (vertical slice) — do not raise until gate passes
music_mood: "soft impact, satisfying squish on the 100% half"
caption: "0% と 100% で同じ物を落とすとこうなる #shorts #blender #satisfying #softbody"
hashtags:
  - softbody
  - blender
  - satisfying
  - physics
  - shorts
video_template: default_shorts
narration:
  enabled: false
thumbnail:
  style: bold_headline
  headline: 0% vs 100%

status_note: >
  Gate 0 の blocked を解除。scene_script を実装済み
  (simulators/blender/scenes/soft_body_torus_compare.py)。当初案の
  softness_stages（cloth_drop_faces と同じ段階再生）はやめ、2本同時比較に変更した。
  runner.py の staged 分岐は params["face_counts"] でフレーム計算するため、
  この企画では意味を持たないキーを置くことになるのも理由。落下側は rigid body では
  なく Collision モディファイア＋キーフレームにしている（Blender のソフトボディ
  ソルバは rigid body world と相互作用しないため）。
  Phase 1 で見るべき点: (1) 100% 側が本当に潰れているか（goal_default=0 が効いて
  いるか）、(2) ソフトボディのベイクが6秒スライスで完了するか、(3) 2列が 9:16 に
  収まっているか。
