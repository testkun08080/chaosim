title: "Glass Wall Shatter — Sphere Impact"
slug: glass_fracture_wall
simulator: blender
scene_script: glass_fracture_wall
duration_sec: 10
description: >
  A steel sphere is launched at a glass pane. On contact the pane breaks into a
  radial web of shards — rings and spokes, the way real glass actually fails —
  and the crack races outward from the impact point before the shards drop and
  scatter across the floor.
hook: "衝突はフレーム10。そこから亀裂が外へ走り出すまでが最初の0.5秒"
viral_angle: >
  破壊・破砕は満足系シミュレーションの中でも最上位のブラケット。Kawaken_3DCG の
  上位ショートは800万〜1300万再生で、破壊系がその中で不釣り合いに多い。
  ガラスは「一点から全体へ広がる」構造が視覚的に読み取りやすく、9:16 の縦画面に
  そのまま収まるのも強い。
references:
  - "Kawaken_3DCG shorts (youtube.com/@Kawaken_3DCG/shorts) — 破壊・衝突ブラケット"
  - "The Most Satisfying Physics Simulations of 2025 (youtube.com/watch?v=1Y2lkiTFptw) — 破砕が定番構成として登場"
  - "Glass Window Breaking Simulation in Blender (youtube.com/watch?v=P8VHGjWBQ4w) — 技術参考"
params:
  pane_width: 1.6
  pane_height: 2.4
  pane_thickness: 0.03
  fracture_shard_count: 80          # Phase 1 は低めに。Phase 2 で上げる
  projectile: sphere
  projectile_radius: 0.22
  projectile_speed: 12.0
  impact_point: [0.0, 0.0, 1.2]
  shard_scatter_force: 3.0
  crack_speed: 9.0
  camera_distance: 4.6
  camera_height: 0.0
  camera_pitch_deg: 88
  camera_lens: 40
render_preset: preview   # Phase 1 (vertical slice) — do not raise until gate passes
music_mood: "sharp impact hit, glass-shard shimmer tail"
caption: "一撃で全部砕ける #shorts #blender #destruction #satisfying"
hashtags:
  - destruction
  - blender
  - satisfying
  - physics
  - shorts
video_template: default_shorts
narration:
  enabled: false
thumbnail:
  style: bold_headline
  headline: 一撃で全壊

status_note: >
  Gate 0 の blocked を解除。scene_script を実装済み
  (simulators/blender/scenes/glass_fracture_wall.py)。Cell Fracture アドオンは
  headless Blender で有効にならないため使わず、リング×スポークの放射状シャード
  ウェブをメッシュから直接生成している。シャードは kinematic で保持し、衝突点
  からの距離に比例したフレームで ACTIVE に切り替えることで亀裂が外側へ伝播する。
  Phase 1 で見るべき点: (1) 亀裂の伝播速度 crack_speed が 6秒スライスに収まって
  いるか、(2) ガラスのトランスミッションが preview の32サンプルで破綻していないか、
  (3) 発射体がシャードを押し切れているか。
