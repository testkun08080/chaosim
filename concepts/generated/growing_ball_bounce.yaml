title: "The Ball Grows Every Bounce"
slug: growing_ball_bounce
simulator: blender
scene_script: growing_ball
duration_sec: 20
description: >
  A glowing ball ricochets around a tall closed arena. Every wall contact makes it
  a little bigger, so the bounces get shorter and land more often, until the ball
  is nearly wall-to-wall and can barely move. Zero gravity keeps it pinballing so
  the clip loops cleanly.
hook: "フレーム1から跳ね始める。2バウンド目には既に目に見えて大きくなっている"
viral_angle: >
  ViralBalls 系「跳ねるたびに大きくなるボール」の直系。視聴者が常に次の衝突を
  半秒先読みしている状態を作れるのが強みで、TikTok/Shorts の満足系で最も
  完走率が取れる予測ループ構造。等速の拡大なので「いつ詰まるか」という
  終着点が視聴者側に見えており、そこまで見たくなる。
  無重力にしてあるのはループ点を作るため（落ち切って止まらない）。
references:
  - "ViralBalls — Free Satisfying Ball Physics Simulator (viralballs.com) — このフォーマット専用のジェネレータが存在するほど定着"
