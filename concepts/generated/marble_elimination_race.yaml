title: "24 Marbles, 6 Ramps — Who Reaches the Bottom First?"
slug: marble_elimination_race
simulator: blender
scene_script: marble_race
duration_sec: 18
description: >
  24 rainbow marbles are released at the top of a tall zig-zag switchback track.
  They pile up at every corner, overtake each other on the straights and spill
  into the catch basin at the bottom. The track is built vertically so the entire
  race is visible in one 9:16 frame — no camera move needed.
hook: "フレーム1で全マーブルが落下開始。最初のコーナーの詰まりが0.5秒以内に来る"
viral_angle: >
  マーブルレースは Shorts/TikTok の常設タグで、Jelle's Marble Runs が実写で確立し
  Algodoo 系の2Dシミュがショートに移植して定着させたフォーマット。勝敗という
  明確なゴールがあるため「最後まで見る理由」が構造的に組み込まれている。
  縦に積んだトラックは 9:16 と相性が良く、全体を映したまま密度を出せる。
