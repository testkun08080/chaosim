[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "chaosim"
version = "0.1.0"
description = "Chaos simulation short video automation pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "requests>=2.31",
]

[project.scripts]
chaosim = "scripts.chaosim:cli"

[tool.setuptools.packages.find]
where = ["."]
